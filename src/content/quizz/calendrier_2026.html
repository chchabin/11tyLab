    --blue-sun-bg:   #D6E4F5;
    --orange-ferie:  #C96A10;
    --orange-ferie-bg: #FDF0E0;
    --today-bg:      #4A4A4A;
    --today-col:     #ffffff;
    --weekend-bg:    #D6E4F5;
  }

  @media print {
    .page { page-break-after: always; }
    .page:last-child { page-break-after: avoid; }
    .nav-bar { display: none !important; }
    body { background: white; }
  }

  html { font-size: 13px; }
  body {
    font-family: 'EB Garamond', Georgia, serif;
    background: #E8E8E8;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── Navigation ── */
  .nav-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bordeaux);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 0.55rem 2rem;
    border-bottom: 2px solid var(--gold);
    box-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }
  .nav-bar h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--parchment);
  }
  .nav-btn {
    font-family: 'EB Garamond', serif;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    color: var(--parchment-mid);
    background: transparent;
    border: 1px solid rgba(214,160,23,0.4);
    border-radius: 2px;
    padding: 0.3rem 1rem;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover, .nav-btn.active {
    background: var(--gold);
    color: var(--bordeaux);
    border-color: var(--gold);
  }
  .nav-sep { color: var(--gold); font-size: 1rem; opacity: 0.5; }

  /* ── Sélecteur d'année ── */
  .year-selector {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .year-arrow {
    font-family: 'EB Garamond', serif;
    font-size: 1.1rem;
    color: var(--gold);
    background: transparent;
    border: 1px solid rgba(214,160,23,0.35);
    border-radius: 2px;
    width: 1.8rem;
    height: 1.8rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
    line-height: 1;
    padding: 0;
  }
  .year-arrow:hover {
    background: var(--gold);
    color: var(--bordeaux);
    border-color: var(--gold);
  }
  .year-display {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--parchment);
    min-width: 4rem;
    text-align: center;
    cursor: default;
    user-select: none;
  }

  /* ── Pages ── */
  .page {
    display: none;
    max-width: 1400px;
    margin: 1.5rem auto;
    padding: 0 1rem 2rem;
  }
  .page.visible { display: block; }

  /* ── Grille des 6 mois ── */
  .months-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    background: var(--gold);
    border: 2px solid var(--gold);
    gap: 1px;
  }

  /* ── Colonne d'un mois ── */
  .month-col {
    background: var(--parchment);
    display: flex;
    flex-direction: column;
  }

  .month-name {
    background: var(--bordeaux);
    color: var(--parchment);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: center;
    padding: 0.5rem 0.2rem 0.4rem;
    border-bottom: 1px solid var(--gold);
  }

  /* ── Lignes de jours ── */
  .day-row {
    display: grid;
    grid-template-columns: 1.6rem 2.2rem 1fr;
    align-items: center;
    padding: 0.18rem 0.3rem;
    gap: 0.15rem;
    border-bottom: 1px solid rgba(0,0,0,0.07);
    transition: background 0.1s;
  }
  .day-row:last-child { border-bottom: none; }
  .day-row:hover { background: rgba(0,0,0,0.04); }

  .day-num {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--ink-mid);
    text-align: right;
    padding-right: 0.2rem;
    font-variant-numeric: tabular-nums;
  }
  .day-name {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--ink-lt);
    text-transform: uppercase;
  }
  .day-saint {
    font-size: 0.72rem;
    color: var(--ink-mid);
    font-style: italic;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 0.2rem;
  }
  .saint-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .vac-pipe {
    flex-shrink: 0;
    display: inline-block;
    width: 2px;
    height: 1.1rem;
    border-radius: 1px;
    margin-left: auto;
    opacity: 0.9;
  }
  .vac-pipe  { background: #C0202A; }

  /* ── Samedi & Dimanche ── */
  .day-row.is-saturday,
  .day-row.is-sunday {
    background: var(--weekend-bg);
  }
  .day-row.is-sunday .day-num,
  .day-row.is-sunday .day-name {
    color: var(--blue-sun);
    font-weight: 600;
  }
  .day-row.is-sunday .day-saint {
    color: var(--blue-sun);
    font-style: italic;
  }

  /* ── Jour férié ── */
  .day-row.is-ferie {
    background: var(--orange-ferie-bg);
  }
  .day-row.is-ferie .day-num,
  .day-row.is-ferie .day-name {
    color: var(--orange-ferie);
    font-weight: 700;
  }
  .day-row.is-ferie .day-saint {
    color: var(--orange-ferie);
    font-style: normal;
    font-weight: 600;
  }

  /* ── Samedi/Dimanche ET férié ── */
  .day-row.is-saturday.is-ferie,
  .day-row.is-sunday.is-ferie {
    background: linear-gradient(90deg, var(--orange-ferie-bg) 0%, var(--weekend-bg) 100%);
  }

  /* ── BTS Blanc (fond jaune clair) ── */
  .day-row[data-bts="blanc"] { background: #FFFACC !important; }
  .day-row[data-bts="stage"] { background: #EDE0F5 !important; }
  .day-row[data-bts="both"]  { background: linear-gradient(90deg, #FFFACC 50%, #EDE0F5 50%) !important; }

  /* ── Aujourd'hui ── */
  .day-row.is-today {
    background: var(--today-bg) !important;
    border-left: 2px solid var(--gold);
  }
  .day-row.is-today .day-num,
  .day-row.is-today .day-name,
  .day-row.is-today .day-saint {
    color: var(--today-col) !important;
    font-style: normal;
    font-weight: 600;
  }

  /* ── Légende ── */
  .legend {
    background: var(--bordeaux);
    border: 2px solid var(--gold);
    border-top: 1px solid var(--gold);
    display: flex;
    align-items: center;
    gap: 1.8rem;
    padding: 0.5rem 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--parchment-mid);
    letter-spacing: 0.03em;
  }
  .legend-swatch {
    width: 1rem;
    height: 1rem;
    border-radius: 2px;
    border: 1px solid rgba(255,255,255,0.25);
    flex-shrink: 0;
  }
  /* ── Panneau BTS ── */
  .bts-panel {
    max-width: 1400px;
    margin: 1rem auto 0;
    padding: 0 1rem;
  }
  .bts-toggle {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--bordeaux);
    color: #fff;
    border: none;
    border-radius: 3px 3px 0 0;
    padding: 0.4rem 1rem;
    font-family: 'EB Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background 0.15s;
  }
  .bts-toggle:hover { background: #666; }
  .bts-toggle .arrow { font-size: 0.7rem; transition: transform 0.2s; }
  .bts-toggle.open .arrow { transform: rotate(90deg); }

  .bts-form {
    display: none;
    background: #fff;
    border: 1px solid #ddd;
    border-top: 3px solid var(--bordeaux);
    border-radius: 0 3px 3px 3px;
    padding: 1rem 1.2rem;
    gap: 0.8rem 2rem;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .bts-form.open { display: flex; }

  .bts-group {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    min-width: 240px;
  }
  .bts-group label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .bts-group label .pipe-preview {
    display: inline-block;
    width: 2px;
    height: 0.85rem;
    border-radius: 1px;
    flex-shrink: 0;
  }
  .bts-row {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .bts-row span {
    font-size: 0.75rem;
    color: #888;
    white-space: nowrap;
  }
  .bts-row input[type="date"] {
    font-family: 'EB Garamond', serif;
    font-size: 0.82rem;
    border: 1px solid #ccc;
    border-radius: 2px;
    padding: 0.25rem 0.4rem;
    color: #333;
    background: #fafafa;
    flex: 1;
    min-width: 130px;
  }
  .bts-row input[type="date"]:focus {
    outline: none;
    border-color: var(--bordeaux);
    background: #fff;
  }
  .bts-apply {
    font-family: 'EB Garamond', serif;
    font-size: 0.85rem;
    background: var(--bordeaux);
    color: #fff;
    border: none;
    border-radius: 3px;
    padding: 0.45rem 1.2rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    align-self: flex-end;
    transition: background 0.15s;
  }
  .bts-apply:hover { background: #333; }
  .bts-reset {
    font-family: 'EB Garamond', serif;
    font-size: 0.82rem;
    background: transparent;
    color: #888;
    border: 1px solid #ccc;
    border-radius: 3px;
    padding: 0.45rem 0.8rem;
    cursor: pointer;
    align-self: flex-end;
    transition: background 0.15s;
  }
  .bts-reset:hover { background: #f0f0f0; }
</style>
</head>

// ─── Jours fériés 2026 ────────────────────────────────────────────────────────
function computeFeries(year) {
  const f = {};
  const set = (m, d, label) => {
    f[`${year}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`] = label;
  };
  // Pâques (Meeus/Jones/Butcher)
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d2=Math.floor(b/4), e=b%4, fv=Math.floor((b+8)/25);
  const g=Math.floor((b-fv+1)/3), h=(19*a+b-d2-g+15)%30;
  const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7;
  const m2=Math.floor((a+11*h+22*l)/451);
  const pm=Math.floor((h+l-7*m2+114)/31);
  const pd=((h+l-7*m2+114)%31)+1;
  const paques=new Date(year,pm-1,pd);
  const addDays=(date,n)=>{const d=new Date(date);d.setDate(d.getDate()+n);return d;};
  const keyOf=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  f[keyOf(addDays(paques,1))]="Lundi de Pâques";
  f[keyOf(addDays(paques,39))]="Ascension";
  f[keyOf(addDays(paques,50))]="Lundi de Pentecôte";
  set(1,1,"Jour de l'An");
  set(5,1,"Fête du Travail");
  set(5,8,"Victoire 1945");
  set(7,14,"Fête Nationale");
  set(8,15,"Assomption");
  set(11,1,"Toussaint");
  set(11,11,"Armistice 1918");
  set(12,25,"Noël");
  return f;
}

// ─── État ─────────────────────────────────────────────────────────────────────
// YEAR = première année de l'année scolaire (ex: 2025 pour 2025-2026)
// Si aujourd'hui >= septembre → année courante, sinon année précédente
function initYear() {
  try {
    if (typeof Temporal !== 'undefined') {
      const t = Temporal.Now.plainDateISO();
      return t.month >= 9 ? t.year : t.year - 1;
    }
  } catch(e) {}
  const d = new Date();
  return d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
}
let YEAR = initYear();

// ─── Helpers Temporal / fallback ─────────────────────────────────────────────
function getToday() {
  try {
    if (typeof Temporal !== 'undefined') {
      const t = Temporal.Now.plainDateISO();
      return `${t.year}-${String(t.month).padStart(2,'0')}-${String(t.day).padStart(2,'0')}`;
    }
  } catch(e){}
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getMonthInfo(year, month) {
  try {
    if (typeof Temporal !== 'undefined') {
      const first = Temporal.PlainDate.from({year, month, day:1});
      return { daysInMonth: first.daysInMonth, startDow: first.dayOfWeek };
    }
  } catch(e){}
  const first = new Date(year, month-1, 1);
  let dow = first.getDay();
  return {
    daysInMonth: new Date(year, month, 0).getDate(),
    startDow: dow === 0 ? 7 : dow
  };
}

function getDow(year, month, day) {
  try {
    if (typeof Temporal !== 'undefined') {
      return Temporal.PlainDate.from({year, month, day}).dayOfWeek;
    }
  } catch(e){}
  const d = new Date(year, month-1, day);
  const js = d.getDay();
  return js === 0 ? 7 : js;
}

// ─── Vacances scolaires Zone C (Paris, Créteil, Versailles, Montpellier, Toulouse) ──
// Format : [debut_inclusif, fin_inclusif] en "YYYY-MM-DD"
const VACANCES_ZONE_C = {
  2024: [
    ["2024-10-19","2024-11-04"], // Toussaint
    ["2024-12-21","2025-01-06"], // Noël
  ],
  2025: [

    ["2025-02-15","2025-03-03"], // Hiver
    ["2025-04-12","2025-04-28"], // Printemps
    ["2025-07-05","2025-09-01"], // Été
    ["2025-10-18","2025-11-03"], // Toussaint
    ["2025-12-20","2026-01-05"], // Noël
  ],
  2026: [
    ["2026-01-01","2026-01-05"], // Noël (fin)
    ["2026-02-14","2026-03-02"], // Hiver
    ["2026-04-18","2026-05-04"], // Printemps
    ["2026-07-04","2026-08-31"], // Été
    ["2026-10-17","2026-11-02"], // Toussaint
    ["2026-12-19","2027-01-04"], // Noël
  ],
  2027: [
    ["2027-01-01","2027-01-04"], // Noël (fin)
    ["2027-02-13","2027-03-01"], // Hiver
    ["2027-04-10","2027-04-26"], // Printemps
    ["2027-07-03","2027-08-31"], // Été
    ["2027-10-23","2027-11-08"], // Toussaint
    ["2027-12-18","2028-01-03"], // Noël
  ],
  2028: [
    ["2028-01-01","2028-01-03"], // Noël (fin)
    ["2028-02-12","2028-02-28"], // Hiver
    ["2028-04-22","2028-05-08"], // Printemps
    ["2028-07-01","2028-08-31"], // Été
    ["2028-10-21","2028-11-06"], // Toussaint
    ["2028-12-23","2029-01-07"], // Noël
  ],
};

function buildVacSet(year) {
  const ranges = [];
  // Inclure les périodes de l'année précédente qui débordent sur janvier
  if (VACANCES_ZONE_C[year - 1]) {
    VACANCES_ZONE_C[year - 1].forEach(([d, f]) => {
      if (f >= `${year}-01-01`) ranges.push([d, f]);
    });
  }
  if (VACANCES_ZONE_C[year]) {
    VACANCES_ZONE_C[year].forEach(r => ranges.push(r));
  }
  // Inclure les périodes de l'année suivante qui commencent avant fin de l'année
  if (VACANCES_ZONE_C[year + 1]) {
    VACANCES_ZONE_C[year + 1].forEach(([d, f]) => {
      if (d <= `${year}-12-31`) ranges.push([d, f]);
    });
  }
  return ranges;
}

function isVacanceC(dateKey, ranges) {
  return ranges.some(([d, f]) => dateKey >= d && dateKey <= f);
}
const DAY_SHORT = ['','Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS_FR = ['','Janvier','Février','Mars','Avril','Mai','Juin',
                      'Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

// ─────────────────────────────────────────────────────────────────────────────
// PÉRIODES À RENSEIGNER ICI (format "YYYY-MM-DD", ou null si non défini)
// ─────────────────────────────────────────────────────────────────────────────
const BTS_BLANC_1_DEBUT  = "2026-12-14";
const BTS_BLANC_1_FIN    = "2026-12-18";

const BTS_BLANC_2_DEBUT  = "2027-04-15";
const BTS_BLANC_2_FIN    = "2027-04-15";

const STAGE_1A_DEBUT     = "2027-05-31";
const STAGE_1A_FIN       = "2027-06-26";

const STAGE_2A_DEBUT     = "2027-01-18";
const STAGE_2A_FIN       = "2027-03-13";
// ─────────────────────────────────────────────────────────────────────────────

const BTS_PERIODS = [
  { id: 'bts1',   color: '#8B2BE2', label: 'BTS Blanc 1',     start: BTS_BLANC_1_DEBUT, end: BTS_BLANC_1_FIN   },
  { id: 'bts2',   color: '#D4006A', label: 'BTS Blanc 2',     start: BTS_BLANC_2_DEBUT, end: BTS_BLANC_2_FIN   },
  { id: 'stage1', color: '#007A5E', label: 'Stage 1ʳᵉ année', start: STAGE_1A_DEBUT,    end: STAGE_1A_FIN      },
  { id: 'stage2', color: '#B85C00', label: 'Stage 2ᵉ année',  start: STAGE_2A_DEBUT,    end: STAGE_2A_FIN      },
];

function toggleBts() {
  const btn = document.getElementById('bts-toggle');
  const form = document.getElementById('bts-form');
  btn.classList.toggle('open');
  form.classList.toggle('open');
}

// Pré-remplit les inputs et met à jour les légendes depuis BTS_PERIODS
function initBtsForm() {
  BTS_PERIODS.forEach(p => {
    const startEl = document.getElementById(`${p.id}-start`);
    const endEl   = document.getElementById(`${p.id}-end`);
    if (startEl && p.start) startEl.value = p.start;
    if (endEl   && p.end)   endEl.value   = p.end;
    const show = (p.start && p.end) ? 'flex' : 'none';
    const el1 = document.getElementById(`legend-${p.id}`);
    const el2 = document.getElementById(`legend-${p.id}2`);
    if (el1) el1.style.display = show;
    if (el2) el2.style.display = show;
  });
}

function applyBts() {
  BTS_PERIODS.forEach(p => {
    const startEl = document.getElementById(`${p.id}-start`);
    const endEl   = document.getElementById(`${p.id}-end`);
    p.start = (startEl && startEl.value) ? startEl.value : null;
    p.end   = (endEl   && endEl.value)   ? endEl.value   : null;
  });
  // Mettre à jour les légendes
  BTS_PERIODS.forEach(p => {
    const show = (p.start && p.end) ? 'flex' : 'none';
    const el1 = document.getElementById(`legend-${p.id}`);
    const el2 = document.getElementById(`legend-${p.id}2`);
    if (el1) el1.style.display = show;
    if (el2) el2.style.display = show;
  });
  render();
}

function resetBts() {
  BTS_PERIODS.forEach(p => {
    p.start = null; p.end = null;
    document.getElementById(`${p.id}-start`).value = '';
    document.getElementById(`${p.id}-end`).value   = '';
    const el1 = document.getElementById(`legend-${p.id}`);
    const el2 = document.getElementById(`legend-${p.id}2`);
    if (el1) el1.style.display = 'none';
    if (el2) el2.style.display = 'none';
  });
  render();
}

function getBtsPipesFor(dateKey) {
  // Retourne la liste des périodes BTS actives pour ce jour
  return BTS_PERIODS.filter(p => p.start && p.end && dateKey >= p.start && dateKey <= p.end);
}

// ─── Construction d'une colonne-mois ─────────────────────────────────────────
function buildMonth(year, month, vacRanges, feriesYear) {
  const col = document.createElement('div');
  col.className = 'month-col';

  const title = document.createElement('div');
  title.className = 'month-name';
  title.textContent = MONTHS_FR[month];
  col.appendChild(title);

  const today = getToday();
  const { daysInMonth } = getMonthInfo(year, month);

  for (let day = 1; day <= daysInMonth; day++) {
    const dateKey = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dow = getDow(year, month, day);
    const isSaturday = dow === 6;
    const isSunday = dow === 7;
    const ferie = feriesYear[dateKey];
    const isToday = dateKey === today;
    const saint = SAINTS[`${month}-${day}`] || '';
    const isVac = isVacanceC(dateKey, vacRanges);
    const btsPipes = getBtsPipesFor(dateKey);

    const row = document.createElement('div');
    row.className = 'day-row';
    if (isSaturday) row.classList.add('is-saturday');
    if (isSunday)   row.classList.add('is-sunday');
    if (ferie)      row.classList.add('is-ferie');
    if (isToday)    row.classList.add('is-today');

    // Fond BTS blanc (jaune) et stage (orange) via data-attribute
    const inBtsBlanc = btsPipes.some(p => p.id === 'bts1' || p.id === 'bts2');
    const inStage    = btsPipes.some(p => p.id === 'stage1' || p.id === 'stage2');
    if (inBtsBlanc && inStage) row.setAttribute('data-bts', 'both');
    else if (inBtsBlanc)       row.setAttribute('data-bts', 'blanc');
    else if (inStage)          row.setAttribute('data-bts', 'stage');

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = day;

    const nameEl = document.createElement('div');
    nameEl.className = 'day-name';
    nameEl.textContent = DAY_SHORT[dow];

    const saintEl = document.createElement('div');
    saintEl.className = 'day-saint';

    const textSpan = document.createElement('span');
    textSpan.className = 'saint-text';
    textSpan.textContent = ferie || saint;
    saintEl.title = ferie || saint;
    saintEl.appendChild(textSpan);

    if (isVac) {
      const pipe = document.createElement('span');
      pipe.className = 'vac-pipe';
      pipe.title = 'Vacances scolaires Zone C';
      saintEl.appendChild(pipe);
    }

    btsPipes.forEach(p => {
      // Pas de pipe pour BTS blanc et stages — le fond suffit
      if (p.id === 'bts1' || p.id === 'bts2' || p.id === 'stage1' || p.id === 'stage2') return;
      const pipe = document.createElement('span');
      pipe.className = 'vac-pipe';
      pipe.style.background = p.color;
      pipe.title = p.label;
      saintEl.appendChild(pipe);
    });

    row.appendChild(numEl);
    row.appendChild(nameEl);
    row.appendChild(saintEl);
    col.appendChild(row);
  }

  return col;
}

// ─── Mise à jour des en-têtes de page ────────────────────────────────────────
function updateHeaders() {
  document.getElementById('year-display').textContent = `${YEAR}–${YEAR+1}`;
  document.title = `Almanach ${YEAR}–${YEAR+1}`;
}

// ─── Rendu complet ────────────────────────────────────────────────────────────
function render() {
  const grid1 = document.getElementById('grid1');
  const grid2 = document.getElementById('grid2');
  grid1.innerHTML = '';
  grid2.innerHTML = '';

  const y1 = YEAR;      // sept–déc de la 1ère année + jan–fév de y2
  const y2 = YEAR + 1;  // jan–août de la 2ème année

  const feries1 = computeFeries(y1);
  const feries2 = computeFeries(y2);

  const vacRanges = [...buildVacSet(y1), ...buildVacSet(y2)];

  const hasVacData = VACANCES_ZONE_C[y1] !== undefined || VACANCES_ZONE_C[y2] !== undefined;
  document.getElementById('legend-vac').style.display  = hasVacData ? 'flex' : 'none';
  document.getElementById('legend-vac2').style.display = hasVacData ? 'flex' : 'none';

  // Page 1 : Septembre–Décembre (y1) + Janvier–Février (y2)
  for (let m = 9; m <= 12; m++) grid1.appendChild(buildMonth(y1, m, vacRanges, feries1));
  for (let m = 1; m <= 2;  m++) grid1.appendChild(buildMonth(y2, m, vacRanges, feries2));

  // Page 2 : Mars–Août (y2)
  for (let m = 3; m <= 8;  m++) grid2.appendChild(buildMonth(y2, m, vacRanges, feries2));

  updateHeaders();
}

// ─── Changement d'année ───────────────────────────────────────────────────────
function changeYear(delta) {
  YEAR += delta;
  const yd = document.getElementById('year-display');
  yd.style.transition = 'opacity 0.15s';
  yd.style.opacity = '0';
  setTimeout(() => {
    render();
    // Après changement d'année, rester sur la page 1
    showPage(1);
    yd.style.opacity = '1';
  }, 150);
}

// ─── Ouvrir sur la bonne page selon le mois courant ──────────────────────────
function openOnToday() {
  const today = getToday();
  const month = parseInt(today.split('-')[1]);
  // Page 1 : sept(9) → fév(2) ; Page 2 : mars(3) → août(8)
  const page = (month >= 9 || month <= 2) ? 1 : 2;
  showPage(page);
}

render();
initBtsForm();
openOnToday();
