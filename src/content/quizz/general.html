#screen-start h2{font-size:20px;font-weight:600;margin-bottom:8px}
#screen-start p{color:#6B6760;font-size:14px;margin-bottom:24px}
#name-input{width:100%;max-width:320px;padding:11px 14px;border:1px solid #DDD9D0;border-radius:8px;font-size:15px;font-family:inherit;outline:none;text-align:center;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto}
#name-input:focus{border-color:#2A5FBF}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pb{flex:1;height:5px;background:#E5E2DA;border-radius:3px;overflow:hidden}
.pbf{height:100%;background:#2A5FBF;border-radius:3px;transition:width .4s}
#timer-display{font-size:13px;font-weight:600;color:#2A5FBF;min-width:54px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
#timer-display.warn{color:#B03030}
.card{background:#fff;border:1px solid #DDD9D0;border-radius:14px;padding:22px;margin-bottom:14px}
.qn{font-size:11px;color:#A09C96;margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.qt{font-size:17px;font-weight:500;margin-bottom:14px;line-height:1.5}
.qimg{max-width:100%;max-height:240px;border-radius:8px;margin-bottom:14px;display:block}
.opt{padding:10px 14px;border-radius:9px;border:1px solid #DDD9D0;margin-bottom:8px;cursor:pointer;font-size:14px;user-select:none;transition:border-color .15s,background .15s}
.opt:hover{border-color:#2A5FBF;background:#EEF3FC}
.opt.sel{border-color:#2A5FBF;background:#EEF3FC;color:#1A3E85}
.opt.ok{border-color:#1D8C6C;background:#E0F4ED;color:#0A4A38;cursor:default}
.opt.ko{border-color:#B03030;background:#FCEAEA;color:#5A1A1A;cursor:default}
.opt.neutral{cursor:default;opacity:.55}
.tfrow{display:flex;gap:10px}
.tfb{flex:1;padding:10px;border-radius:9px;border:1px solid #DDD9D0;background:#fff;cursor:pointer;font-size:14px;text-align:center;transition:border-color .15s,background .15s}
.tfb:hover{border-color:#2A5FBF}
.tfb.sel{border-color:#2A5FBF;background:#EEF3FC;color:#1A3E85}
.tfb.ok{border-color:#1D8C6C;background:#E0F4ED;color:#0A4A38;cursor:default}
.tfb.ko{border-color:#B03030;background:#FCEAEA;color:#5A1A1A;cursor:default}
.freein{width:100%;padding:10px 12px;border:1px solid #DDD9D0;border-radius:9px;font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.freein:focus{border-color:#2A5FBF}
.freein.ok{border-color:#1D8C6C;background:#E0F4ED;color:#0A4A38}
.freein.ko{border-color:#B03030;background:#FCEAEA}
.gap-wrap{font-size:15px;line-height:2.8;margin-bottom:10px}
.ginp{border:none;border-bottom:2px solid #A09C96;padding:2px 5px;font-size:14px;font-family:inherit;background:transparent;outline:none;color:#1A1814;min-width:80px}
.ginp:focus{border-color:#2A5FBF}
.ginp.ok{border-color:#1D8C6C;color:#0A4A38}
.ginp.ko{border-color:#B03030;color:#B03030}
.mwrap{display:flex;gap:14px}
.mcol{flex:1;display:flex;flex-direction:column;gap:6px}
.mi{padding:9px 12px;border-radius:9px;border:1px solid #DDD9D0;font-size:13px;cursor:pointer;user-select:none;text-align:center;transition:border-color .15s,background .15s}
.mi:hover:not(.matched){border-color:#2A5FBF}
.mi.sel{border-color:#2A5FBF;background:#EEF3FC;color:#1A3E85}
.mi.matched{border-color:#1D8C6C;background:#E0F4ED;color:#0A4A38;cursor:default}
.mi.ko{border-color:#B03030;background:#FCEAEA;color:#B03030}
.expl{margin-top:12px;font-size:13px;color:#6B6760;border-left:2px solid #DDD9D0;padding-left:10px;line-height:1.6}
.btnrow{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bval,.bcorr,.bnext{padding:9px 22px;border:none;border-radius:9px;font-size:14px;font-family:inherit;cursor:pointer}
.bval{background:#2A5FBF;color:#fff}
.bval:hover{background:#1A3E85}
.bcorr{background:#6B4FBB;color:#fff;display:none}
.bcorr:hover{background:#4e3a8e}
.bnext{background:#2A5FBF;color:#fff;display:none}
.bnext:hover{background:#1A3E85}
#screen-result{display:none}
.res-header{background:#fff;border:1px solid #DDD9D0;border-radius:14px;padding:32px 28px;text-align:center;margin-bottom:16px}
.res-header h2{font-size:28px;font-weight:600;margin-bottom:10px}
.res-sub{color:#6B6760;font-size:15px;margin-bottom:5px}
.brst{padding:10px 26px;background:#2A5FBF;color:#fff;border:none;border-radius:9px;font-size:14px;font-family:inherit;cursor:pointer;margin-top:14px}
.brst:hover{background:#1A3E85}
.recap-title{font-size:11px;font-weight:600;color:#A09C96;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid #E5E2DA}
.recap-card{background:#fff;border:1px solid #DDD9D0;border-radius:12px;padding:16px;margin-bottom:10px}
.recap-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.rbadge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
.rbadge.ok{background:#1D8C6C;color:#fff}
.rbadge.ko{background:#B03030;color:#fff}
.rbadge.sk{background:#A09C96;color:#fff}
.recap-qtext{font-size:14px;font-weight:500;line-height:1.4;flex:1}
.recap-row{display:flex;gap:8px;font-size:13px;margin-bottom:5px;align-items:baseline;flex-wrap:wrap}
.rlabel{color:#A09C96;font-size:11px;min-width:110px;flex-shrink:0}
.rval.ok{color:#0A4A38;font-weight:500}
.rval.ko{color:#B03030}
.recap-expl{margin-top:8px;font-size:12px;color:#6B6760;border-left:2px solid #DDD9D0;padding-left:8px;line-height:1.5}
.gap-inline{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.gap-val{border-radius:4px;padding:1px 7px;font-weight:500;font-size:13px}
.gap-val.ok{background:#E0F4ED;color:#0A4A38}
.gap-val.ko{background:#FCEAEA;color:#B03030}
.gap-corr{font-size:11px;color:#A09C96}
.mpill{flex:1;padding:3px 8px;border-radius:5px;text-align:center;font-size:12px}
.mpill.l{background:#EEF3FC;color:#1A3E85}
.mpill.r{background:#E0F4ED;color:#0A4A38}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#DDD9D0;border-radius:3px}
.codein{width:100%;min-height:120px;font-family:monospace;font-size:13px;padding:10px;border:1px solid #DDD9D0;border-radius:9px;background:#F8F8F6;color:#1A1814;resize:vertical;outline:none;tab-size:2}
.codein:focus{border-color:#2A5FBF}
.codeout{background:#1A1814;color:#E5E2DA;padding:12px;border-radius:9px;font-size:12px;font-family:monospace;min-height:40px;white-space:pre-wrap;margin-top:10px;word-break:break-all}
.codeout.ok{outline:2px solid #1D8C6C}
.codeout.ko{outline:2px solid #B03030}
.code-note{font-size:12px;color:#6B6760;background:#F2F0EB;border-radius:6px;padding:8px 10px;margin-bottom:10px;border-left:2px solid #2A5FBF}.CodeMirror{border:1px solid #DDD9D0;border-radius:9px;font-family:monospace;font-size:13px;min-height:120px;background:#F8F8F6;color:#1A1814;height:auto}.CodeMirror-focused{border-color:#2A5FBF;outline:none}.CodeMirror-scroll{min-height:120px}.cm-keyword{color:#2A5FBF;font-weight:bold}.cm-atom{color:#7B2FBF}.cm-number{color:#C27000}.cm-string{color:#1D8C6C}.cm-string-2{color:#1D8C6C}.cm-comment{color:#999;font-style:italic}.cm-def{color:#9B1D8C}.cm-variable-2{color:#1A3E85}.cm-type{color:#1D758C}.cm-builtin{color:#2A5FBF}.cm-operator{color:#666}
pre{background:#F8F8F6;border-radius:9px;padding:12px;overflow-x:auto;margin:8px 0;border:1px solid #DDD9D0}
pre code.hljs{display:block;padding:0;background:transparent}
.hljs{color:#1A1814}
.hljs-keyword,.hljs-built_in{color:#2A5FBF;font-weight:bold}
.hljs-string,.hljs-template-string{color:#1D8C6C}
.hljs-comment{color:#999;font-style:italic}
.hljs-number,.hljs-literal{color:#C27000}
.hljs-type{color:#1D758C;font-weight:500}
.hljs-title{color:#9B1D8C}
.hljs-operator{color:#666}
.hljs-punctuation{color:#555}

var QS,cur=0,score=0,corrected=false,selL=null,mDone=false,mCount=0,codeOutput=null,_csComp=null,_cmEditor=null;

var answers=[],selState=null;

function startQuiz(){
  var n=document.getElementById('name-input').value.trim()||CFG.defaultName||'';
  userName=n;
  launchQuiz();
}
function launchQuiz(){
  QS=CFG.shuffle?RAW.slice().sort(function(){return Math.random()-.5}):RAW;
  answers=QS.map(function(){return{sel:null,ok:false};});
  cur=0;score=0;startTime=Date.now();
  document.getElementById('screen-start').style.display='none';
  document.getElementById('screen-quiz').style.display='block';
  if(CFG.timer){
    timerLeft=CFG.timerH*3600+CFG.timerM*60+CFG.timerS;
    if(timerLeft>0){
      document.getElementById('timer-display').style.display='block';
      renderTimer();
      timerInterval=setInterval(function(){timerLeft--;renderTimer();if(timerLeft<=0){clearInterval(timerInterval);showResult(true);}},1000);
    }
  }
  show();
}
function renderTimer(){
  var td=document.getElementById('timer-display');
  var h=Math.floor(timerLeft/3600),m=Math.floor((timerLeft%3600)/60),s=timerLeft%60;
  td.textContent=(h>0?h+'h':'')+(m<10&&h>0?'0':'')+m+':'+(s<10?'0':'')+s;
  td.className=timerLeft<=30?'warn':'';
}
function show(){
  if(cur>=QS.length){showResult(false);return;}
  corrected=false;selL=null;mDone=false;mCount=0;selState=null;codeOutput=null;if(_cmEditor){_cmEditor.toTextArea();_cmEditor=null;}

    h+='<div class="btnrow"><button class="bval" onclick="valFree()">Valider</button><button class="bnext" id="nb" onclick="nxt()">'+(isLast?'Terminer &#10003;':'Suivant &#8594;')+'</button></div>';
  }else if(q.type==='gap'){
    var gi=0,gapRaw=q.gapText||'',gt;if(gapRaw.indexOf('<pre')!==-1&&typeof hljs!=='undefined'){gt=gapRaw.replace(/<pre([^>]*)><code([^>]*)>([^]*?)<\/code><\/pre>/g,function(full,pa,ca,cc){var lang=(ca.match(/language-(w+)/)||['','csharp'])[1];var parts=cc.split(/\[\[([^\]]+)\]\]/);var result='';for(var pi=0;pi<parts.length;pi++){if(pi%2===0){if(parts[pi]){var segHl;try{segHl=hljs.highlight(parts[pi],{language:lang,ignoreIllegals:true}).value;}catch(e2){segHl=hljs.highlightAuto(parts[pi]).value;}result+=segHl;}}else{var id='gi'+(gi++);var ans=parts[pi];result+='<input class="ginp" id="'+id+'" data-a="'+ans.toLowerCase()+'" size="'+Math.max(ans.length+2,8)+'" placeholder="…">';}}return '<pre'+pa+'><code class="hljs language-'+lang+'">'+result+'<\/code><\/pre>';});gt=gt.replace(/\[\[([^\]]+)\]\]/g,function(m,a){var id='gi'+(gi++);return '<input class="ginp" id="'+id+'" data-a="'+a.toLowerCase()+'" size="'+Math.max(a.length+2,8)+'" placeholder="…">';});}else{gt=gapRaw.replace(/\[\[([^\]]+)\]\]/g,function(m,a){var id='gi'+(gi++);return '<input class="ginp" id="'+id+'" data-a="'+a.toLowerCase()+'" size="'+Math.max(a.length+2,8)+'" placeholder="…">';});}h+='<div class="gap-wrap">'+gt+'</div>';
    h+='<div class="btnrow"><button class="bval" onclick="valGap()">Valider</button><button class="bnext" id="nb" onclick="nxt()">'+(isLast?'Terminer &#10003;':'Suivant &#8594;')+'</button></div>';
  }else if(q.type==='match'){
    var ls=q.pairs.map(function(p){return p.l;}),rs=q.pairs.map(function(p,i){return{t:p.r,i:i};}).sort(function(){return Math.random()-.5;});
    h+='<p style="font-size:12px;color:#A09C96;margin-bottom:10px">Cliquez un \u00e9l\u00e9ment \u00e0 gauche puis un \u00e0 droite.</p>';
    h+='<div class="mwrap"><div class="mcol" id="ml">';
    ls.forEach(function(l,i){h+='<div class="mi" id="ml'+i+'" onclick="pl('+i+')">'+l+'</div>';});
    h+='</div><div class="mcol" id="mr">';
    rs.forEach(function(r,i){h+='<div class="mi" id="mr'+i+'" data-oi="'+r.i+'" onclick="pr('+i+')">'+r.t+'</div>';});
    h+='</div></div><div class="btnrow"><button class="bnext" id="nb" onclick="nxt()">'+(isLast?'Terminer &#10003;':'Suivant &#8594;')+'</button></div>';
  }else if(q.type==='code'){
    if(q.testNote) h+='<div class="code-note">'+q.testNote+'</div>';
    h+='<textarea class="codein" id="codein">'+((q.starterCode||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'))+'</textarea>';
    h+='<pre class="codeout" id="codeout">(sortie ici)</pre>';
    h+='<div class="btnrow"><button class="bval" id="run-btn" onclick="runCode()">Exécuter ▶</button>';
    if(q.expectedOutput) h+='<button class="bval" id="val-code-btn" onclick="valCode()" disabled>Évaluer</button>';
    h+='<button class="bnext" id="nb" onclick="codeNxt()">'+(isLast?'Terminer &#10003;':'Suivant &#8594;')+'</button></div>';
  }
  if(q.expl) h+='<div class="expl" id="ex" style="display:none">'+q.expl+'</div>';
  h+='</div>';
  document.getElementById('qa').innerHTML=h;
  if(q.type==='code'&&typeof CodeMirror!=='undefined'){_cmEditor=CodeMirror.fromTextArea(document.getElementById('codein'),{mode:'text/x-csharp',lineNumbers:true,indentUnit:2,tabSize:2,lineWrapping:true});_cmEditor.setSize('100%',null);}document.querySelectorAll('#qa pre code:not(.hljs)').forEach(function(el){if(typeof hljs!=='undefined'&&!el.querySelector('.ginp'))hljs.highlightElement(el);});
}
function sEx(){if(CFG.expl){var e=document.getElementById('ex');if(e)e.style.display='block';}}
function snb(){var n=document.getElementById('nb');if(n)n.style.display='inline-block';}
function showBcorr(){var b=document.getElementById('bcorr');if(b)b.style.display='inline-block';}
function showCorr(){
  if(corrected)return;corrected=true;
  var q=QS[cur],bc=document.getElementById('bcorr');if(bc)bc.style.display='none';
  if(q.type==='qcm1'){
    q.opts.forEach(function(o,j){var el=document.getElementById('opt'+j);if(!el)return;el.className='opt '+(o.c?'ok':(selState===j?'ko':'neutral'));});
    if(selState!==null&&q.opts[selState]&&q.opts[selState].c){score++;answers[cur].ok=true;}
    answers[cur].sel=selState;
  }else if(q.type==='tf'){
    var tfv=document.getElementById('tfv'),tff=document.getElementById('tff');
    if(tfv)tfv.className='tfb '+(q.correct==='true'?'ok':(selState==='true'?'ko':''));
    if(tff)tff.className='tfb '+(q.correct==='false'?'ok':(selState==='false'?'ko':''));
    if(selState===q.correct){score++;answers[cur].ok=true;}
    answers[cur].sel=selState;
  }
  sEx();snb();
}
function po(el,i){
  if(corrected)return;var q=QS[cur];
  if(q.type==='qcm1'){
    q.opts.forEach(function(o,j){var e=document.getElementById('opt'+j);if(e)e.className='opt';});
    el.className='opt sel';selState=i;
    if(CFG.corrMode==='immediate'){
      corrected=true;
      q.opts.forEach(function(o,j){var e=document.getElementById('opt'+j);if(!e)return;e.className='opt '+(o.c?'ok':(j===i?'ko':'neutral'));});
      if(q.opts[i].c){score++;answers[cur].ok=true;}
      answers[cur].sel=i;sEx();snb();
    }else if(CFG.corrMode==='deferred'){showBcorr();}
    else{answers[cur].sel=i;snb();}
  }else{
    if(!answers[cur].sel)answers[cur].sel=[];
    var idx=answers[cur].sel.indexOf(i);
    if(idx>-1){answers[cur].sel.splice(idx,1);el.className='opt';}
    else{answers[cur].sel.push(i);el.className='opt sel';}
  }
}
function valM(){
  var bv=document.getElementById('bval');if(bv)bv.style.display='none';
  if(CFG.corrMode==='immediate'||CFG.corrMode==='deferred'){
    corrected=true;var q=QS[cur],sel=answers[cur].sel||[];
    var allOk=q.opts.every(function(o,j){return o.c===(sel.indexOf(j)>-1);});
    if(allOk){score++;answers[cur].ok=true;}
    q.opts.forEach(function(o,j){var e=document.getElementById('opt'+j);if(e)e.className='opt '+(o.c?'ok':(sel.indexOf(j)>-1?'ko':'neutral'));});
    sEx();
  }snb();
}
function ptf(v){
  if(corrected)return;selState=v;answers[cur].sel=v;
  var tfv=document.getElementById('tfv'),tff=document.getElementById('tff');
  if(tfv)tfv.className='tfb'+(v==='true'?' sel':'');
  if(tff)tff.className='tfb'+(v==='false'?' sel':'');
  if(CFG.corrMode==='immediate'){
    corrected=true;var q=QS[cur],ok=q.correct===v;
    if(ok){score++;answers[cur].ok=true;}
    if(tfv)tfv.className='tfb '+(q.correct==='true'?'ok':(v==='true'?'ko':''));
    if(tff)tff.className='tfb '+(q.correct==='false'?'ok':(v==='false'?'ko':''));
    sEx();snb();
  }else if(CFG.corrMode==='deferred'){showBcorr();}
  else snb();
}
function valFree(){
  if(corrected)return;corrected=true;
  var q=QS[cur],fi=document.getElementById('fi'),v=fi.value.trim();
  answers[cur].sel=v;
  var ok=q.answer&&v.toLowerCase()===q.answer.toLowerCase();
  if(ok){score++;answers[cur].ok=true;}
  fi.className='freein '+(q.answer?(ok?'ok':'ko'):'');fi.disabled=true;
  var bv=document.getElementById('bval');if(bv)bv.style.display='none';
  sEx();snb();
}
function valGap(){
  if(corrected)return;corrected=true;
  var vals=[],allOk=true;
  document.querySelectorAll('.ginp').forEach(function(inp){
    var ok=inp.value.trim().toLowerCase()===inp.getAttribute('data-a');
    vals.push(inp.value.trim());inp.className='ginp '+(ok?'ok':'ko');inp.disabled=true;if(!ok)allOk=false;
  });
  answers[cur].sel=vals;if(allOk){score++;answers[cur].ok=true;}
  var bv=document.getElementById('bval');if(bv)bv.style.display='none';sEx();snb();
}
function pl(i){
  if(mDone)return;
  document.querySelectorAll('#ml .mi').forEach(function(e){if(e.className.indexOf('matched')<0)e.className='mi';});
  var el=document.getElementById('ml'+i);if(el&&el.className.indexOf('matched')<0){el.className='mi sel';selL=i;}
}
function pr(i){
  if(mDone||selL===null)return;
  var rel=document.getElementById('mr'+i),oi=parseInt(rel.getAttribute('data-oi')),lel=document.getElementById('ml'+selL);
  if(oi===selL){
    lel.className='mi matched';rel.className='mi matched';mCount++;
    if(mCount===QS[cur].pairs.length){mDone=true;corrected=true;score++;answers[cur].ok=true;answers[cur].sel='all';sEx();snb();}
  }else{
    lel.className='mi ko';rel.className='mi ko';
    setTimeout(function(){if(lel.className.indexOf('matched')<0)lel.className='mi';if(rel.className.indexOf('matched')<0)rel.className='mi';},500);
  }selL=null;
}
function nxt(){cur++;show();}
function runCode(){
  if(corrected)return;
  var q=QS[cur],code=(_cmEditor?_cmEditor.getValue():document.getElementById('codein').value),btn=document.getElementById('run-btn'),codeout=document.getElementById('codeout');
  btn.disabled=true;btn.textContent='...';
  codeout.textContent='Exécution...';codeout.className='codeout';
  fetch('https://ce.judge0.com/submissions?base64_encoded=false&wait=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:code,language_id:51})})
  .then(function(r){return r.json();})
  .then(function(data){
    var out=(data.stdout||''),err=(data.stderr||''),comp=(data.compile_output||'');
    codeOutput=out;
    var disp=out||(comp?'[Compilation]\n'+comp:(err?'[Erreur]\n'+err:'(aucune sortie)'));
    codeout.textContent=disp;
    btn.disabled=false;btn.textContent='Exécuter ▶';
    var vbtn=document.getElementById('val-code-btn');if(vbtn)vbtn.disabled=false;else snb();
  })
  .catch(function(e){codeout.textContent='Erreur: '+e.message;btn.disabled=false;btn.textContent='Exécuter ▶';});
}
function codeNxt(){
  if(!corrected){
    corrected=true;
    var q=QS[cur],ok=!q.expectedOutput||(codeOutput!==null&&codeOutput.trim()===(q.expectedOutput||'').trim());
    if(!answers[cur])answers[cur]={};
    answers[cur].sel=codeOutput!==null?codeOutput:'';
    answers[cur].ok=ok;
    if(ok)score++;
  }
  cur++;show();
}

function valCode(){
  if(corrected)return;corrected=true;
  var q=QS[cur],ok=!q.expectedOutput||(codeOutput!==null&&codeOutput.trim()===(q.expectedOutput||'').trim());
  if(!answers[cur])answers[cur]={};
  answers[cur].sel=codeOutput!==null?codeOutput:'';answers[cur].ok=ok;
  if(ok)score++;
  var codeout=document.getElementById('codeout');if(codeout)codeout.className='codeout '+(ok?'ok':'ko');
  var bv=document.getElementById('val-code-btn');if(bv)bv.style.display='none';
  sEx();snb();
}
function computeScores(){
  score=0;
  QS.forEach(function(q,i){
    var a=answers[i],ok=false;
    if(q.type==='qcm1') ok=(a.sel!==null&&q.opts[a.sel]&&q.opts[a.sel].c);
    else if(q.type==='qcm2'){var sel=a.sel||[];ok=q.opts.every(function(o,j){return o.c===(sel.indexOf(j)>-1);});}
    else if(q.type==='tf') ok=(a.sel!==null&&a.sel===q.correct);
    else if(q.type==='free') ok=!!(q.answer&&a.sel&&a.sel.toLowerCase()===q.answer.toLowerCase());
    else if(q.type==='gap'){var vals=a.sel||[],gi=0,aok=vals.length>0;(q.gapText||'').replace(/\[\[([^\]]+)\]\]/g,function(m,ans){if(!vals[gi]||vals[gi].toLowerCase()!==ans.toLowerCase())aok=false;gi++;});ok=aok;}
    else if(q.type==='match') ok=(a.sel==='all');
    else if(q.type==='code') ok=!q.expectedOutput||(a.sel!==null&&a.sel!==undefined&&a.sel.trim()===(q.expectedOutput||'').trim());
    answers[i].ok=ok;if(ok)score++;
  });
}
function showResult(timeout){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  if(CFG.corrMode==='end') computeScores();
  document.getElementById('screen-quiz').style.display='none';
  var r=document.getElementById('screen-result');r.style.display='block';
  var total=QS.length,answered=timeout?cur:total;
  var pct=answered>0?Math.round(score/answered*100):0;
  var elapsed=Math.round((Date.now()-startTime)/1000);
  var msg=timeout?'Temps \u00e9coul\u00e9\u00a0!':(pct>=80?'Excellent\u00a0!':(pct>=60?'Bien jou\u00e9\u00a0!':'Continuez \u00e0 pratiquer\u00a0!'));
  var h='<div class="res-header"><h2>'+msg+'</h2>';
  if(userName) h+='<div class="res-sub">Participant\u00a0: <strong>'+userName+'</strong></div>';
  if(CFG.score) h+='<div class="res-sub">Score\u00a0: <strong>'+score+' / '+answered+'</strong> \u2014 '+pct+'%</div>';
  if(CFG.allowretry) h+='<button class="brst" onclick="rst()">Recommencer</button>';
  h+='</div>';
  if(CFG.corrMode==='end'){
    h+='<div class="recap-title">Correction d\u00e9taill\u00e9e</div>';
    QS.forEach(function(q,i){
      if(timeout&&i>=cur)return;
      var a=answers[i],noAns=(a.sel===null||a.sel===undefined||(Array.isArray(a.sel)&&!a.sel.length));
      var badge=noAns?'sk':(a.ok?'ok':'ko');
      h+='<div class="recap-card"><div class="recap-top"><div class="rbadge '+badge+'">'+(badge==='ok'?'\u2713':(badge==='ko'?'\u2717':'?'))+'</div><div class="recap-qtext">Q'+(i+1)+'. '+q.text+'</div></div>';
      if(q.image)h+='<img style="max-width:100%;max-height:140px;border-radius:6px;margin-bottom:8px" src="'+q.image+'" alt="">';
      if(q.type==='qcm1'){
        var sl=(!noAns&&q.opts[a.sel])?q.opts[a.sel].t:'(sans r\u00e9ponse)',cl=q.opts.filter(function(o){return o.c;}).map(function(o){return o.t;}).join(', ');
        h+='<div class="recap-row"><span class="rlabel">Votre r\u00e9ponse</span><span class="rval '+(a.ok?'ok':'ko')+'">'+sl+'</span></div>';
        if(!a.ok)h+='<div class="recap-row"><span class="rlabel">Bonne r\u00e9ponse</span><span class="rval ok">'+cl+'</span></div>';
      }else if(q.type==='qcm2'){
        var sel=a.sel||[],sll=sel.length?sel.map(function(j){return q.opts[j]?q.opts[j].t:'?';}).join(', '):'(sans r\u00e9ponse)',cll=q.opts.filter(function(o){return o.c;}).map(function(o){return o.t;}).join(', ')||'(aucune)';
        h+='<div class="recap-row"><span class="rlabel">Votre r\u00e9ponse</span><span class="rval '+(a.ok?'ok':'ko')+'">'+sll+'</span></div>';
        if(!a.ok)h+='<div class="recap-row"><span class="rlabel">Bonne r\u00e9ponse</span><span class="rval ok">'+cll+'</span></div>';
      }else if(q.type==='tf'){
        var tfm={'true':'Vrai','false':'Faux'};
        h+='<div class="recap-row"><span class="rlabel">Votre r\u00e9ponse</span><span class="rval '+(a.ok?'ok':'ko')+'">'+(a.sel?tfm[a.sel]:'(sans r\u00e9ponse)')+'</span></div>';
        if(!a.ok)h+='<div class="recap-row"><span class="rlabel">Bonne r\u00e9ponse</span><span class="rval ok">'+tfm[q.correct]+'</span></div>';
      }else if(q.type==='free'){
        h+='<div class="recap-row"><span class="rlabel">Votre r\u00e9ponse</span><span class="rval '+(a.ok?'ok':'ko')+'">'+(a.sel||'(sans r\u00e9ponse)')+'</span></div>';
        if(q.answer&&!a.ok)h+='<div class="recap-row"><span class="rlabel">R\u00e9ponse attendue</span><span class="rval ok">'+q.answer+'</span></div>';
      }else if(q.type==='gap'){
        var vals=Array.isArray(a.sel)?a.sel:[],gi2=0;
        var gapH=(q.gapText||'').replace(/\[\[([^\]]+)\]\]/g,function(m,ans){var v=vals[gi2]||'',gok=v.toLowerCase()===ans.toLowerCase();gi2++;return '<span class="gap-inline"><span class="gap-val '+(gok?'ok':'ko')+'">'+(v||'\u2026')+'</span>'+(gok?'':'<span class="gap-corr">\u2192 '+ans+'</span>')+'</span>';});
        h+='<div style="font-size:13px;line-height:2.4;margin-top:4px">'+gapH+'</div>';
      }else if(q.type==='match'){
        h+='<div class="recap-row"><span class="rlabel">Association</span><span class="rval '+(a.ok?'ok':'ko')+'">'+(a.ok?'Correcte':'Incompl\u00e8te')+'</span></div>';
        h+='<div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">';
        q.pairs.forEach(function(p){h+='<div style="display:flex;gap:6px;align-items:center"><span class="mpill l">'+p.l+'</span><span style="color:#A09C96;font-size:11px">\u2192</span><span class="mpill r">'+p.r+'</span></div>';});
        h+='</div>';
      }else if(q.type==='code'){
        var codeS=a.sel!==null&&a.sel!==undefined?String(a.sel).replace(/&/g,'&amp;').replace(/</g,'&lt;'):'(non ex\u00e9cut\u00e9)';
        h+='<div class="recap-row"><span class="rlabel">Sortie obtenue</span><span class="rval '+(a.ok?'ok':'ko')+'">'+(codeS||'(vide)')+'</span></div>';
        if(q.expectedOutput&&!a.ok)h+='<div class="recap-row"><span class="rlabel">Sortie attendue</span><span class="rval ok">'+q.expectedOutput+'</span></div>';
      }
      if(CFG.expl&&q.expl)h+='<div class="recap-expl"><strong>Explication\u00a0:</strong> '+q.expl+'</div>';
      h+='</div>';
    });
    if(CFG.allowretry)h+='<div style="text-align:center;padding:12px 0"><button class="brst" onclick="rst()">Recommencer</button></div>';
  }
  r.innerHTML=h;
  if(CFG.sendresults&&CFG.sheetsUrl) sendSilent(score,answered,pct,elapsed,timeout);
}
function sendSilent(sc,answered,pct,elapsed,timeout){
  var detail=QS.map(function(q,i){
    var a=answers[i]||{},ok=a.ok?'\u2713':'\u2717',sel=a.sel,label='';
    if(q.type==='qcm1') label=(sel!==null&&q.opts[sel])?q.opts[sel].t:'(sans r\u00e9ponse)';
    else if(q.type==='qcm2'){var s=sel||[];label=s.length?s.map(function(j){return q.opts[j]?q.opts[j].t:'?';}).join('+'):'(sans r\u00e9ponse)';}
    else if(q.type==='tf') label=sel?(sel==='true'?'Vrai':'Faux'):'(sans r\u00e9ponse)';
    else if(q.type==='free') label=sel||'(sans r\u00e9ponse)';
    else if(q.type==='gap') label=Array.isArray(sel)?sel.join('|'):'(sans r\u00e9ponse)';
    else if(q.type==='match') label=sel==='all'?'Toutes correctes':'Incompl\u00e8te';
    else if(q.type==='code') label=a.sel!==null&&a.sel!==undefined?a.sel:'(non ex\u00e9cut\u00e9)';
    return ok+' Q'+(i+1)+': '+q.text+' \u2192 '+label;
  }).join(' | ');
  var payload={userName:userName,quizTitle:document.title,score:sc,total:answered,pct:pct,elapsed:elapsed,timeout:!!timeout,answers:answers,questions:QS,detail:detail};
  try{fetch(CFG.sheetsUrl,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});}catch(e){}
}
function rst(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  document.getElementById('screen-result').style.display='none';
  if(CFG.askname){document.getElementById('name-input').value='';document.getElementById('screen-start').style.display='block';}
  else launchQuiz();
}
if(!CFG.askname){userName=CFG.defaultName||'';document.getElementById('screen-start').style.display='none';launchQuiz();}

</script>
